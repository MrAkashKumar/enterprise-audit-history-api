spring:
  application:
    name: enterprise-audit-history-api
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:audit_app}
    password: ${ORACLE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [traceId=%X{traceId:-none}] %logger{36} - %msg%n"
audit-api:
  audit-suffix: _AUD
  id-column: ID
  audit-order-column: REV
  revision-type-column: REVTYPE
  max-page-size: ${AUDIT_MAX_PAGE_SIZE:200}
  # Comma-separated example: PMC_HOLIDAY_CALENDAR,PMC_EMPLOYEE,PMC_SETTLEMENT_INSTRUCTION
  allowed-tables: ${AUDIT_ALLOWED_TABLES:PMC_HOLIDAY_CALENDAR,PMC_LOCO_SINGAPORE,PMC_POSITION_BALANCE}
  security:
    enabled: ${AUDIT_API_KEY_ENABLED:false}
    header-name: X-API-Key
    key: ${AUDIT_API_KEY:}
