spring:
  application:
    name: enterprise-audit-history-api
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:audit_app}
    password: ${ORACLE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
audit-api:
  source-table-prefix: ${AUDIT_SOURCE_TABLE_PREFIX:PMC_}
  audit-suffix: _AUD
  id-column: ID
  audit-order-column: REV
  revision-type-column: REVTYPE
  max-page-size: ${AUDIT_MAX_PAGE_SIZE:200}
  approval:
    suffixes:
      - _APPROVAL_REQUEST
      - _APPROVAL
    id-column: ID
    maker-username-column: MAKER_USERNAME
    checker-username-column: CHECKER_USERNAME
    table-overrides: {}
